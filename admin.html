<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PaenLaen's Office · Admin</title>

  <style>
    :root {
      --ink: #5e4d57;
      --muted: #927b87;
      --cream: #fffaf2;
      --pink: #f6b6ca;
      --mint: #afe2d2;
      --yellow: #ffe397;
      --line: #ecd9cd;
      --danger: #d96e82;
      --success: #4aaf8b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      font-family: "Trebuchet MS", "Noto Sans Thai", Tahoma, sans-serif;
      background:
        radial-gradient(circle at 8% 5%, #ffdbe5 0, transparent 23rem),
        radial-gradient(circle at 95% 3%, #c9f0e2 0, transparent 25rem),
        #fff6e9;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .page {
      width: min(960px, calc(100% - 28px));
      margin: 0 auto;
      padding: 28px 0 45px;
    }

    .header {
      display: flex;
      gap: 15px;
      align-items: center;
      margin-bottom: 22px;
    }

    .logo {
      display: grid;
      width: 55px;
      height: 55px;
      place-items: center;
      font-size: 27px;
      background: #fff;
      border: 3px solid #fff;
      border-radius: 18px;
      box-shadow: 0 5px 0 #e9cbd3, 0 10px 24px rgba(111, 74, 87, 0.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 1.9rem);
      letter-spacing: -0.04em;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .panel {
      padding: 22px;
      background: rgba(255, 253, 248, 0.9);
      border: 4px solid #fff;
      border-radius: 24px;
      box-shadow: 0 16px 45px rgba(115, 77, 89, 0.13);
    }

    .login-panel {
      width: min(430px, 100%);
      margin: 10vh auto 0;
      text-align: center;
    }

    .login-panel h2 {
      margin: 0 0 8px;
    }

    .login-panel p {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 0.9rem;
    }

    label {
      display: block;
      margin: 0 0 7px;
      color: #846c77;
      font-size: 0.8rem;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 11px 12px;
      color: var(--ink);
      background: #fffdf9;
      border: 1px solid var(--line);
      border-radius: 12px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #e79cb3;
      box-shadow: 0 0 0 4px rgba(231, 156, 179, 0.16);
    }

    textarea {
      min-height: 78px;
      resize: vertical;
    }

    .button {
      width: 100%;
      padding: 12px 15px;
      color: #684f5a;
      font-weight: bold;
      cursor: pointer;
      background: #ffd7e2;
      border: 0;
      border-radius: 13px;
      box-shadow: 0 4px 0 #e9a5b9;
    }

    .button:hover {
      filter: brightness(0.98);
    }

    .button:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #e9a5b9;
    }

    .button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .button.secondary {
      width: auto;
      color: #61776e;
      background: #d7f0e6;
      box-shadow: 0 4px 0 #9bcfbf;
    }

    .button.warning {
      width: auto;
      color: #7a633a;
      background: #ffe397;
      box-shadow: 0 4px 0 #dfbc6a;
    }

    .error,

    .notice {
      display: none;
      margin-top: 13px;
      padding: 10px 12px;
      font-size: 0.84rem;
      border-radius: 11px;
    }

    .error {
      color: #9b4054;
      background: #ffe2e8;
    }

    .notice {
      color: #347c63;
      background: #dff6eb;
    }

    .admin-content {
      display: none;
    }

    .admin-content.show {
      display: block;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 15px;
    }

    .toolbar p {
      margin: 0;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .agent-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 11px;
      margin-bottom: 18px;
    }

    .agent-card {
      padding: 14px;
      text-align: left;
      cursor: pointer;
      background: #fffdf9;
      border: 2px solid transparent;
      border-radius: 16px;
    }

    .agent-card:hover {
      background: #fff7f8;
    }

    .agent-card.active {
      background: #fff1f5;
      border-color: #efa8bd;
    }

    .agent-card strong {
      display: block;
      font-size: 1rem;
    }

    .agent-card span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.76rem;
    }

    .status-pill {
      display: inline-block !important;
      margin-top: 9px !important;
      padding: 4px 7px;
      color: #715b66 !important;
      background: #f5e8df;
      border-radius: 999px;
    }

    .editor-title {
      margin: 0 0 18px;
      font-size: 1.1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      margin-bottom: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .progress-line {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input[type="range"] {
      padding: 0;
      accent-color: #e992ad;
    }

    #progressValue {
      min-width: 42px;
      color: #9d6978;
      font-weight: bold;
      text-align: right;
    }

    .save-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-top: 6px;
    }

    .save-row .button {
      width: auto;
      min-width: 175px;
    }

    .back-link {
      display: inline-block;
      margin-top: 19px;
      color: #8e6977;
      font-size: 0.85rem;
      text-decoration: none;
    }

    .button.danger {
      background: #ffcfd4;
      color: #a64d5d;
      box-shadow: 0 4px 0 #dfa5b3;
      width: auto;
      min-width: 80px;
    }
    .button.danger:hover {
      background: #ffbcce;
    }

    .queue-panel {
      margin-top: 25px;
    }

    .queue-form {
      display: grid;
      grid-template-columns: 1fr 2fr auto;
      gap: 12px;
      align-items: end;
      margin-bottom: 20px;
      padding-bottom: 20px;
      border-bottom: 1px dashed var(--line);
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .queue-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 15px;
      background: #fffdf9;
      border: 1px solid var(--line);
      border-radius: 14px;
    }

    .queue-info {
      flex: 1;
    }

    .queue-info strong {
      display: block;
      font-size: 0.95rem;
      color: var(--ink);
    }

    .queue-info span {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .queue-actions {
      display: flex;
      gap: 8px;
      margin-left: 15px;
    }

    .queue-item.editing {
      background: #fff;
      border-color: #efa8bd;
      box-shadow: 0 0 0 2px rgba(239, 168, 189, 0.3);
    }

    .queue-item.editing .queue-info {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .queue-item.editing input,
    .queue-item.editing textarea {
      margin-bottom: 5px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .queue-item.editing .queue-actions .button.secondary {
      background: #fff;
      color: var(--ink);
      border: 1px solid var(--line);
      box-shadow: none;
    }
      .queue-form {
        grid-template-columns: 1fr;
      }
      .queue-item {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }
      .queue-actions {
        width: 100%;
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <div class="logo">🔐</div>
      <div>
        <h1>PaenLaen's Office · Admin</h1>
        <p class="subtitle">อัปเดตสถานะทีมตัวจิ๋วของคุณ</p>
      </div>
    </header>

    <section class="panel login-panel" id="loginPanel">
      <h2>Welcome back! ✦</h2>
      <p>กรอกรหัสผ่านเพื่อเข้าสู่หน้าจัดการสถานะ</p>

      <form id="loginForm">
        <label for="password">รหัสผ่าน</label>
        <input
          id="password"
          type="password"
          inputmode="numeric"
          autocomplete="current-password"
          required
        />
        <div style="height: 14px"></div>
        <button class="button" id="loginButton" type="submit">
          เข้าสู่หน้าจัดการ
        </button>
        <div class="error" id="loginError"></div>
      </form>
    </section>

    <section class="admin-content" id="adminContent">
      <div class="toolbar">
        <p id="lastUpdated">กำลังโหลดข้อมูล...</p>
        <button class="button secondary" id="reloadButton" type="button">
          ↻ โหลดข้อมูลใหม่
        </button>
      </div>
  
      <div class="agent-list" id="agentList"></div>
  
      <section class="panel">
        <h2 class="editor-title" id="editorTitle">
          เลือกตัวละครที่ต้องการแก้ไข
        </h2>
  
        <form id="agentForm">
          <div class="grid">
            <div class="field">
              <label for="status">สถานะ</label>
              <select id="status" required>
                <option value="working">⌨️ กำลังทำงาน</option>
                <option value="coffee">☕ พักดื่มกาแฟ</option>
                <option value="meeting">🗒️ อยู่ในที่ประชุม</option>
                <option value="idle">🛋️ กำลังพัก</option>
                <option value="blocked">💭 งานติดขัด</option>
              </select>
            </div>
  
            <div class="field">
              <label for="progress">ความคืบหน้า</label>
              <div class="progress-line">
                <input id="progress" type="range" min="0" max="100" value="0" />
                <span id="progressValue">0%</span>
              </div>
            </div>
  
            <div class="field full">
              <label for="task">งานที่กำลังทำ</label>
              <input
                id="task"
                type="text"
                maxlength="150"
                placeholder="เช่น ออกแบบหน้า Landing Page"
              />
            </div>
  
            <div class="field full">
              <label for="note">บันทึกเพิ่มเติมในประวัติ (ไม่แสดงบนหน้าเกม)</label>
              <textarea
                id="note"
                maxlength="300"
                placeholder="เช่น ปรับ mobile layout เรียบร้อยแล้ว"
              ></textarea>
            </div>
          </div>
  
          <div class="save-row">
            <button class="button" id="saveButton" type="submit">
              บันทึกสถานะ ✦
            </button>
            <span class="notice" id="saveNotice"></span>
            <span class="error" id="saveError"></span>
          </div>
        </form>
      </section>

      <section class="panel queue-panel">
        <h2 class="editor-title">📝 บันทึกคิวงานของฉัน</h2>
        <form id="queueForm" class="queue-form">
          <div class="field">
            <label for="qTitle">หัวข้อ</label>
            <input id="qTitle" type="text" placeholder="ชื่องาน..." required />
          </div>
          <div class="field">
            <label for="qDesc">รายละเอียด</label>
            <input id="qDesc" type="text" placeholder="รายละเอียดเพิ่มเติม..." />
          </div>
          <button class="button" type="submit">บันทึก</button>
        </form>
        <div class="queue-list" id="queueList"></div>
      </section>
  
      <a class="back-link" href="./index.html">
        ← กลับไปดู PaenLaen's Office
      </a>
    </section>
  </main>

  <script>
    const API_URL =
      "https://script.google.com/macros/s/AKfycbxSUzPtHByx6hMhv1BXqHwZcTTgldom4LBz7JtzZvFWpKSMfELrJ0SB4uUzOxUB6_wH/exec";

    const statusLabels = {
      working: "⌨️ กำลังทำงาน",
      coffee: "☕ พักดื่มกาแฟ",
      meeting: "🗒️ อยู่ในที่ประชุม",
      idle: "🛋️ กำลังพัก",
      blocked: "💭 งานติดขัด"
    };

    let adminPassword = "";
    let agents = [];
    let selectedAgentId = "";

    const loginPanel = document.getElementById("loginPanel");
    const adminContent = document.getElementById("adminContent");
    const loginError = document.getElementById("loginError");
    const saveError = document.getElementById("saveError");
    const saveNotice = document.getElementById("saveNotice");

    function showMessage(element, message) {
      element.textContent = message;
      element.style.display = "inline-block";
    }

    function hideMessage(element) {
      element.textContent = "";
      element.style.display = "none";
    }

    function loadJsonp(url, callbackPrefix) {
      return new Promise((resolve, reject) => {
        const callbackName = `${callbackPrefix}_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const script = document.createElement("script");
        let finished = false;
        let timeoutId;

        const cleanup = () => {
          if (script.parentNode) script.remove();
          try { delete window[callbackName]; } catch (_) { window[callbackName] = undefined; }
          clearTimeout(timeoutId);
        };

        const fail = message => {
          if (finished) return;
          finished = true;
          cleanup();
          reject(new Error(message));
        };

        window[callbackName] = data => {
          if (finished) return;
          finished = true;
          cleanup();
          resolve(data);
        };

        script.onerror = () => fail(
          "เชื่อมต่อ Google Apps Script ไม่สำเร็จ กรุณาตรวจสอบว่า Web App ถูก Deploy และตั้งค่า Anyone มีสิทธิ์เข้าถึง"
        );

        const separator = url.includes("?") ? "&" : "?";
        script.src = `${url}${separator}callback=${encodeURIComponent(callbackName)}&_=${Date.now()}`;
        document.body.appendChild(script);

        timeoutId = setTimeout(() => fail(
          "หมดเวลารอข้อมูลจาก Google Apps Script กรุณาตรวจสอบ URL ของ Web App และการ Deploy เวอร์ชันล่าสุด"
        ), 15000);
      });
    }

    async function verifyPassword(password) {
      const url =
        `${API_URL}?action=verify` +
        `&password=${encodeURIComponent(password)}`;

      const data = await loadJsonp(url, "verifyCallback");

      if (!data || !data.ok) {
        throw new Error(data?.error || "รหัสผ่านไม่ถูกต้อง");
      }

      return data;
    }

    async function loadOfficeData() {
      const url = `${API_URL}?action=office`;
      const data = await loadJsonp(url, "officeCallback");
  
      if (!data || !data.ok) {
        throw new Error(data?.error || "ไม่สามารถโหลดข้อมูลได้");
      }
  
      return data;
    }

    async function loadQueueData() {
      const url = `${API_URL}?action=getqueue`;
      const data = await loadJsonp(url, "queueCallback");
      if (!data || !data.ok) {
        throw new Error(data?.error || "ไม่สามารถโหลดคิวงานได้");
      }
      return data.queue || [];
    }
  
    async function refreshAgents() {
      const data = await loadOfficeData();
      agents = data.agents || [];
  
      document.getElementById("lastUpdated").textContent =
        `อัปเดตข้อมูลล่าสุด: ${data.updated_at || "-"}`;
  
      if (!selectedAgentId && agents.length) {
        selectedAgentId = agents[0].id;
      }
  
      if (!agents.some(agent => agent.id === selectedAgentId) && agents.length) {
        selectedAgentId = agents[0].id;
      }
  
      renderAgentList();
      fillEditor();
    }

    async function refreshQueue() {
      try {
        const queue = await loadQueueData();
        renderQueueList(queue);
      } catch (error) {
        console.error("Queue Load Error:", error);
      }
    }
  
    function renderQueueList(queue) {
      const list = document.getElementById("queueList");
      list.innerHTML = "";

      if (queue.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:var(--muted); font-size:0.85rem;">ไม่มีคิวงานที่รอดำเนินการ</p>';
        return;
      }

      queue.forEach(task => {
        const item = document.createElement("div");
        item.className = "queue-item";
        item.id = `q-item-${task.task_id}`;
        
        item.innerHTML = `
          <div class="queue-info">
            <strong class="q-title">${escapeHtml(task.title)}</strong>
            <span class="q-desc">${escapeHtml(task.description || "-")}</span>
          </div>
          <div class="queue-actions">
            <button class="button warning" onclick="editTask('${task.task_id}')">แก้ไข</button>
            <button class="button secondary" onclick="updateTask('${task.task_id}', 'completed')">เสร็จแล้ว</button>
            <button class="button danger" onclick="updateTask('${task.task_id}', 'deleted')">ลบ</button>
          </div>
        `;
        list.appendChild(item);
      });
    }

    function editTask(taskId) {
      const item = document.getElementById(`q-item-${taskId}`);
      if(!item) return;
      
      const info = item.querySelector(".queue-info");
      const titleText = info.querySelector(".q-title").textContent;
      const descText = info.querySelector(".q-desc").textContent;
      const actions = item.querySelector(".queue-actions");

      item.classList.add("editing");
      
      info.innerHTML = `
        <input type="text" class="edit-title" value="${escapeHtml(titleText)}" />
        <textarea class="edit-desc">${escapeHtml(descText === "-" ? "" : descText)}</textarea>
      `;
      
      actions.innerHTML = `
        <button class="button secondary" onclick="saveTask('${taskId}')">บันทึก</button>
        <button class="button danger" onclick="cancelEdit('${taskId}')">ยกเลิก</button>
      `;
    }

    function cancelEdit(taskId) {
      item = document.getElementById(`q-item-${taskId}`);
      item.classList.remove("editing");
      refreshQueue();
    }

    async function saveTask(taskId) {
      const item = document.getElementById(`q-item-${taskId}`);
      const title = item.querySelector(".edit-title").value.trim();
      const desc = item.querySelector(".edit-desc").value.trim();

      try {
        await submitUpdateWithoutCors({
          action: "updateTask",
          password: adminPassword,
          task_id: taskId,
          title: title,
          description: desc
        });
        await refreshQueue();
      } catch (error) {
        alert("ไม่สามารถแก้ไขงานได้: " + error.message);
      }
    }

    async function updateTask(taskId, status) {
      try {
        await submitUpdateWithoutCors({
          action: "updateTaskStatus",
          password: adminPassword,
          task_id: taskId,
          status: status
        });
        await refreshQueue();
      } catch (error) {
        alert("ไม่สามารถอัปเดตสถานะงานได้: " + error.message);
      }
    }

    function renderAgentList() {

      const list = document.getElementById("agentList");
      list.innerHTML = "";

      agents.forEach(agent => {
        const button = document.createElement("button");

        button.type = "button";
        button.className =
          `agent-card ${agent.id === selectedAgentId ? "active" : ""}`;

        button.innerHTML = `
          <strong>${escapeHtml(agent.name || "AI Agent")}</strong>
          <span>${escapeHtml(agent.role || "-")}</span>
          <span class="status-pill">
            ${statusLabels[agent.status] || "🛋️ กำลังพัก"}
          </span>
        `;

        button.addEventListener("click", () => {
          selectedAgentId = agent.id;
          renderAgentList();
          fillEditor();
          hideMessage(saveNotice);
          hideMessage(saveError);
        });

        list.appendChild(button);
      });
    }

    function fillEditor() {
      const agent = agents.find(item => item.id === selectedAgentId);

      if (!agent) {
        return;
      }

      document.getElementById("editorTitle").textContent =
        `แก้ไขสถานะของ ${agent.name}`;

      document.getElementById("status").value = agent.status || "idle";
      document.getElementById("task").value = agent.task || "";
      document.getElementById("progress").value = Number(agent.progress || 0);
      document.getElementById("progressValue").textContent =
        `${Number(agent.progress || 0)}%`;
      document.getElementById("note").value = "";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    document.getElementById("progress").addEventListener("input", event => {
      document.getElementById("progressValue").textContent =
        `${event.target.value}%`;
    });

    document.getElementById("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
  
      hideMessage(loginError);
  
      const passwordInput = document.getElementById("password");
      const loginButton = document.getElementById("loginButton");
      const enteredPassword = passwordInput.value.trim();
  
      if (!enteredPassword) {
        showMessage(loginError, "กรุณากรอกรหัสผ่าน");
        return;
      }
  
      loginButton.disabled = true;
      loginButton.textContent = "กำลังตรวจสอบ...";
  
      try {
        await verifyPassword(enteredPassword);
  
        adminPassword = enteredPassword;
  
        await refreshAgents();
        await refreshQueue();
  
        passwordInput.value = "";
        loginPanel.style.display = "none";
        adminContent.classList.add("show");
      } catch (error) {
        adminPassword = "";
        passwordInput.value = "";
        passwordInput.focus();
  
        showMessage(
          loginError,
          error.message || "รหัสผ่านไม่ถูกต้อง"
        );
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "เข้าสู่หน้าจัดการ";
      }
    });

    document.getElementById("reloadButton").addEventListener("click", async () => {
      hideMessage(saveError);
      hideMessage(saveNotice);
  
      try {
        await refreshAgents();
        await refreshQueue();
      } catch (error) {
        showMessage(saveError, error.message || "ไม่สามารถโหลดข้อมูลได้");
      }
    });

    document.getElementById("queueForm").addEventListener("submit", async event => {
      event.preventDefault();
      const title = document.getElementById("qTitle").value.trim();
      const desc = document.getElementById("qDesc").value.trim();

      if (!title) return;

      try {
        await submitUpdateWithoutCors({
          action: "addTask",
          password: adminPassword,
          title: title,
          description: desc
        });
        document.getElementById("qTitle").value = "";
        document.getElementById("qDesc").value = "";
        await refreshQueue();
      } catch (error) {
        alert("ไม่สามารถบันทึกคิวงานได้: " + error.message);
      }
    });

    function submitUpdateWithoutCors(payload) {

      return new Promise((resolve, reject) => {
        const iframeName = `updateFrame_${Date.now()}_${Math.floor(Math.random() * 10000)}`;
        const iframe = document.createElement("iframe");
        iframe.name = iframeName;
        iframe.style.display = "none";
        document.body.appendChild(iframe);

        const form = document.createElement("form");
        form.method = "POST";
        form.action = API_URL;
        form.target = iframeName;
        form.style.display = "none";

        Object.entries(payload).forEach(([name, value]) => {
          const input = document.createElement("input");
          input.type = "hidden";
          input.name = name;
          input.value = value == null ? "" : String(value);
          form.appendChild(input);
        });

        document.body.appendChild(form);
        let settled = false;

        const cleanup = () => {
          if (form.parentNode) form.remove();
          if (iframe.parentNode) iframe.remove();
        };

        const finish = (ok, message) => {
          if (settled) return;
          settled = true;
          cleanup();
          ok ? resolve() : reject(new Error(message));
        };

        iframe.onload = () => finish(true);
        iframe.onerror = () => finish(false, "ส่งข้อมูลไปยัง Google Apps Script ไม่สำเร็จ");
        form.submit();

        setTimeout(() => {
          if (!settled) finish(true);
        }, 5000);
      });
    }

    document.getElementById("agentForm").addEventListener("submit", async event => {
      event.preventDefault();

      hideMessage(saveError);
      hideMessage(saveNotice);

      const selectedAgent = agents.find(
        agent => agent.id === selectedAgentId
      );

      if (!selectedAgent) {
        showMessage(saveError, "กรุณาเลือกตัวละครก่อน");
        return;
      }

      if (!adminPassword) {
        showMessage(saveError, "เซสชันหมดอายุ กรุณารีเฟรชหน้าและเข้าสู่ระบบใหม่");
        return;
      }

      const saveButton = document.getElementById("saveButton");

      saveButton.disabled = true;
      saveButton.textContent = "กำลังบันทึก...";


      try {
        await submitUpdateWithoutCors({
          action: "updateAgent",
          password: adminPassword,
          agent_id: selectedAgent.id,
          status: document.getElementById("status").value,
          task: document.getElementById("task").value.trim(),
          progress: document.getElementById("progress").value,
          note: document.getElementById("note").value.trim()
        });

        await new Promise(resolve => setTimeout(resolve, 700));
        await refreshAgents();

        showMessage(
          saveNotice,
          "บันทึกแล้ว! ข้อมูลถูกส่งไปยัง Google Sheets เรียบร้อย"
        );
      } catch (error) {
        showMessage(
          saveError,
          error.message || "ไม่สามารถบันทึกข้อมูลได้"
        );
      } finally {
        saveButton.disabled = false;
        saveButton.textContent = "บันทึกสถานะ ✦";
      }
    });
  </script>
</body>
</html>
